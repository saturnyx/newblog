<div class="banner">
    <div class="meta">
    {% if page.date %}
    <p class="date">
      <span class="short">{{ page.date | date(format="%d · %m · %y") }}</span>
      <span class="long">{{ page.date | date(format="%A · %B %d · %Y") }}</>
    </p>
    {% endif %}
    <h1 class="title">{{ page.title }}</h1>
        {% if page.description %}
            <p class="description">{{ page.description }}</p>
        {% endif %}
    </div>
</div>
